<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portfólio — Redator Publicitário</title>
  <meta name="description" content="Portfólio de redação publicitária: campanhas, conceitos criativos, roteiros audiovisuais e branded content.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Portfólio — Redator Publicitário">
  <meta property="og:description" content="Campanhas, conceitos criativos, roteiros audiovisuais e branded content.">
  <meta name="theme-color" content="#F5F3EE">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="page-home">
  <a class="skip-link" href="#conteudo">Pular para o conteúdo</a>

  <header class="site-header">
    <div class="site-header__inner container">
      <a class="brand" href="#topo" data-home-link=""><span data-site="name">Seu Nome</span><span class="brand__dot" aria-hidden="true">.</span></a>
      <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-menu">
        <span class="nav-toggle__label">Menu</span><span class="nav-toggle__bars" aria-hidden="true"></span>
      </button>
      <nav id="site-menu" class="site-nav" aria-label="Principal">
        <ul>
          <li><a href="#trabalhos">Trabalhos</a></li>
          <li><a href="#sobre">Sobre</a></li>
          <li><a href="#contato">Contato</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main id="conteudo">
    <!-- HERO -->
    <section class="hero container" id="topo" aria-labelledby="hero-name">
      <div class="hero__top">
        <div class="hero__id">
          <h1 class="hero__name" id="hero-name" data-site="name">Seu Nome</h1>
          <p class="hero__role" data-site="role">Redator Publicitário</p>
        </div>
        <ul class="hero__specialties" id="hero-specialties">
          <li>Ideias.</li><li>Roteiros.</li><li>Histórias.</li>
        </ul>
      </div>

    </section>


    <!-- TRABALHOS -->
    <section class="works container" id="trabalhos" aria-labelledby="works-title">
      <header class="section-head reveal">
        <p class="section-head__num">01</p>
        <h2 class="section-head__title" id="works-title">Trabalhos <em>selecionados</em> <span class="section-head__count" id="work-count"></span></h2>
      </header>
      <div class="work-filters" id="work-filters" role="group" aria-label="Filtrar por categoria" hidden></div>
      <div class="work-grid" id="work-grid" aria-live="polite"></div>
    </section>

    <!-- SOBRE -->
    <section class="about" id="sobre" aria-labelledby="about-title">
      <div class="container about__grid">
        <header class="section-head section-head--side reveal">
          <p class="section-head__num">02</p>
          <h2 class="section-head__title" id="about-title">Sobre</h2>
        </header>
        <p class="about__statement reveal" id="about-statement"></p>
        <div class="about__body prose reveal" id="about-body"></div>
        <div class="about__focus reveal" id="about-focus"></div>
      </div>
    </section>
  </main>

  <!-- CONTATO -->
  <footer class="contact" id="contato" aria-labelledby="contact-headline">
    <div class="container">
      <header class="section-head section-head--invert reveal">
        <p class="section-head__num">03</p>
        <p class="section-head__title">Contato</p>
      </header>
      <h2 class="contact__headline reveal" id="contact-headline"></h2>
      <div class="contact__grid">
        <p class="contact__text reveal" id="contact-text"></p>
        <div class="contact__links reveal" id="contact-links"></div>
      </div>
      <div class="site-footer">
        <p>© <span data-site="year"></span> <span data-site="name"></span></p>
        <a href="#topo">Voltar ao topo <span aria-hidden="true">↑</span></a>
      </div>
    </div>
  </footer>

  <noscript><p class="noscript">Ative o JavaScript para ver os trabalhos.</p></noscript>

  <script src="js/config.js"></script>
  <script src="js/projects.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/home.js"></script>
</body>
</html>
